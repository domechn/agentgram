name: AgentGram
options:
  bundleIdPrefix: dev.domechn
  deploymentTarget:
    macOS: "14.0"
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.70-23383aef
  AgentCore:
    path: Core
targets:
  AgentGram:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Icon]  # SVG source + render script, not bundle resources
    dependencies:
      - package: TDLibKit
      - package: AgentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.domechn.agentgram
        MARKETING_VERSION: 0.2.1
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
