name: AgentGram
options:
  bundleIdPrefix: dev.domechn
  deploymentTarget:
    macOS: "14.0"
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.70-23383aef
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  AgentCore:
    path: Core
targets:
  AgentGram:
    type: application
    platform: macOS
    sources:
      - path: App
        # Icon: SVG source + render script. Info.plist: INFOPLIST_FILE below, not a resource.
        excludes: [Icon, Info.plist]
    dependencies:
      - package: TDLibKit
      - package: Sparkle
      - package: AgentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.domechn.agentgram
        MARKETING_VERSION: 0.3.0
        # Local builds only. A release build gets its number from the version (0.3.1 -> 301,
        # scripts/appcast.py build): the updater compares build numbers.
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # An expression the type checker cannot solve in 30 s fails with its location instead of
        # stalling the build (the default limit is 10 minutes per expression).
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -solver-expression-time-threshold=30 -Xfrontend -warn-long-expression-type-checking=3000"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist  # the Sparkle keys; merged with the generated ones
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
