<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824pt rounded square centred on a 1024 canvas, soft drop shadow -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2b3566"/>
      <stop offset="0.55" stop-color="#161b3a"/>
      <stop offset="1" stop-color="#0b0d1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#4f8dff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4f8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe0ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5f8fe8"/>
      <stop offset="1" stop-color="#a9c8ff"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- paper plane -->
  <g filter="url(#lift)" stroke-linejoin="round" stroke-width="10">
    <path d="M752 286 L412 548 L462 720 Z" fill="url(#body)" stroke="url(#body)"/>
    <path d="M462 720 L437 634 L548 606 Z" fill="#3a5fb0" stroke="#3a5fb0"/>
    <path d="M752 286 L250 470 L412 548 Z" fill="url(#wing)" stroke="url(#wing)"/>
    <path d="M752 286 L548 606 L700 672 Z" fill="#e3edff" stroke="#e3edff"/>
  </g>

  <!-- AI sparks -->
  <g fill="url(#spark)">
    <path d="M318 232 Q328 300 396 310 Q328 320 318 388 Q308 320 240 310 Q308 300 318 232 Z"/>
    <path d="M730 706 Q736 746 776 752 Q736 758 730 798 Q724 758 684 752 Q724 746 730 706 Z"/>
  </g>
</svg>
